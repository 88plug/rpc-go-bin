name: Auto-release

# Tracks upstream device-management-toolkit/rpc-go.
# Cron: daily check. Push: re-check on every main push.
# When upstream tag != PKGBUILD pkgver: bump PKGBUILD + .SRCINFO, commit, tag v<ver>, push.
# The tag push then triggers aur-deploy.yml.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "github.actor != '88plug-bot' && !contains(github.event.head_commit.message, '[skip release]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Compare upstream vs PKGBUILD
        id: compare
        run: |
          UPSTREAM=$(curl -s https://api.github.com/repos/device-management-toolkit/rpc-go/releases/latest | jq -r .tag_name | tr -d v)
          CURRENT=$(grep '^pkgver=' PKGBUILD | cut -d= -f2)
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT"  >> "$GITHUB_OUTPUT"
          if [ "$UPSTREAM" = "$CURRENT" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already at $CURRENT."
          else
            echo "needs_update=true"  >> "$GITHUB_OUTPUT"
            echo "Upgrade $CURRENT -> $UPSTREAM"
          fi

      - name: Compute new SHA256
        if: steps.compare.outputs.needs_update == 'true'
        id: sha
        run: |
          SHA=$(curl -sL "https://github.com/device-management-toolkit/rpc-go/releases/download/v${{ steps.compare.outputs.upstream }}/rpc_linux_x64.tar.gz" | sha256sum | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD and .SRCINFO
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          NEW="${{ steps.compare.outputs.upstream }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          sed -i "s/^pkgver=.*/pkgver=$NEW/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/sha256sums_x86_64=.*/sha256sums_x86_64=('$SHA')/" PKGBUILD
          sed -i "s/pkgver = .*/pkgver = $NEW/" .SRCINFO
          sed -i "s/pkgrel = .*/pkgrel = 1/" .SRCINFO
          sed -i "s|rpc_linux_x64-.*.tar.gz|rpc_linux_x64-$NEW.tar.gz|" .SRCINFO
          sed -i "s|releases/download/v.*/rpc_linux_x64|releases/download/v$NEW/rpc_linux_x64|" .SRCINFO
          sed -i "s/sha256sums_x86_64 = .*/sha256sums_x86_64 = $SHA/" .SRCINFO

      - name: Commit + tag + push (triggers aur-deploy.yml)
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          NEW="${{ steps.compare.outputs.upstream }}"
          git config user.name  "88plug-bot"
          git config user.email "andrew@88plug.com"
          git add PKGBUILD .SRCINFO
          git commit -m "auto: bump to $NEW [skip release]"
          git tag "v$NEW"
          git push origin main
          git push origin "v$NEW"
